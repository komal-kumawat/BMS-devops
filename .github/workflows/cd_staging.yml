name: Deploy to staging

on:
  push:
    branches:
      - bms

jobs:
  redeploy_everything:
    name: Deploying everything to the staging cluster
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 64.227.147.124 >> ~/.ssh/known_hosts

      - name: SSH into server
        run: |
          ssh -i ~/.ssh/id_rsa root@64.227.147.124 "echo Connected successfully"
